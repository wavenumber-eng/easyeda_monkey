name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync
        run: uv sync --all-extras
      - name: Run Rack test lane
        run: uv run rack run --all
      - name: Build package
        run: uv run python -m build
      - name: Check package
        run: uv run twine check dist/*
      - name: Run installed import test
        run: uv run python tests/support_scripts/install_test.py
