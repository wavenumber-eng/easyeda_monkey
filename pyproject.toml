[project]
name = "easyeda-monkey"
version = "2026.6.4"
description = "Core EasyEDA / LCSC symbol, footprint, and 3D reference parsing tooling"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [
    { name = "Wavenumber LLC" },
]
dependencies = [
    "requests>=2.32.0",
]

[project.scripts]
easyeda-monkey = "easyeda_monkey.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-json-report>=1.5.0",
    "wn-rack>=2026.6.4",
    "pyright>=1.1.390",
    "ruff>=0.8.0",
    "twine>=5.0.0",
    "build>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-json-report>=1.5.0",
    "wn-rack>=2026.6.4",
    "pyright>=1.1.390",
    "ruff>=0.8.0",
    "twine>=5.0.0",
    "build>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/wavenumber-eng/easyeda_monkey"
Repository = "https://github.com/wavenumber-eng/easyeda_monkey"
Issues = "https://github.com/wavenumber-eng/easyeda_monkey/issues"

[tool.wn_dev_std]
profile = "python-package"
distribution = "pypi"
languages = ["python"]
strict = true

[tool.uv]
package = true

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "AGENTS.md",
    "src/py/easyeda_monkey/**",
    "README.md",
    "CHANGELOG.md",
    "CODE_OF_CONDUCT.md",
    "LICENSE",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "docs/**",
    "tests/**",
    "pyproject.toml",
]
exclude = [
    "docs/plans/**",
    "docs/research/**",
    "rack_results/**",
    "tests/rack_results/**",
    "tests/**/output/**",
    "**/__pycache__/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/py/easyeda_monkey"]

[tool.hatch.version]
path = "src/py/easyeda_monkey/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/py"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "slow: long-running test lanes",
]

[tool.pyright]
include = [
    "src/py/easyeda_monkey",
    "tests/L0_foundation",
    "tests/L99_signoff",
    "tests/support_scripts",
]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]
ignore = ["D102", "D107", "D415"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]
"src/py/easyeda_monkey/__main__.py" = ["D100"]

[tool.ruff.format]
quote-style = "double"
